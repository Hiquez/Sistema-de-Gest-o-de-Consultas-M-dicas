name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Sem serviço de banco: os testes atuais usam só Mockito, não conectam em banco real.
    # Se no futuro você adicionar testes de integração (@DataJpaTest, @SpringBootTest)
    # que precisem do Oracle de verdade, aí sim entra um "services:" aqui — normalmente
    # com a imagem gvenzl/oracle-xe, que é a mais usada para Oracle em CI.

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          # necessário para o SonarQube analisar o histórico de commits corretamente
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build e testes com cobertura (JaCoCo)
        run: mvn -B clean verify

      - name: Análise SonarQube (com Quality Gate)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.projectKey=Hiquez_Sistema-de-Gest-o-de-Consultas-M-dicas
          -Dsonar.organization=hiquez

      # Publica o relatório de testes mesmo se algum teste falhar, para você ver o que quebrou
      - name: Publicar relatório de testes
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Resultados dos testes
          path: '**/surefire-reports/*.xml'
          reporter: java-junit